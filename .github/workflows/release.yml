name: Release to npm
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release tag matches every package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release-guards.mjs verify-tag
      # Publish via npm's OIDC trusted publisher (configured on npm.com), NOT a token.
      # Two requirements that the previous setup missed:
      #   1. OIDC trusted publishing needs npm >= 11.5.1 — Node 22 ships npm 10, so
      #      we upgrade npm here.
      #   2. No token in .npmrc. We deliberately drop `registry-url` (which would make
      #      setup-node write `//registry.npmjs.org/:_authToken=...`) and NODE_AUTH_TOKEN.
      #      If a token is present, npm uses token auth and trips the account's 2FA
      #      requirement (EOTP). With no token + id-token:write + a trusted publisher,
      #      `npm publish` authenticates via OIDC and attaches provenance automatically.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      # NOTE: do NOT use --frozen-lockfile here. We need bun install to sync the
      # lockfile to whatever versions the bumped package.json files declare, so
      # that `bun pm pack` rewrites workspace:* to the current release version
      # (not the previous release version, which is what `bun.lock` records on
      # the commit that did the bump). See issue #5 (v1.3.0 shipped flagshark
      # depending on @flagshark/core@1.2.0 because the lockfile lagged).
      - run: bun install
      - run: bun run build
      - name: Verify tagged Action artifact trees match source
        run: node scripts/verify-action-artifacts.mjs
      - run: bun run test
      # bun pm pack rewrites workspace:* in the tarball; npm publishes it via the
      # OIDC trusted publisher. Provenance is generated automatically (no --provenance).
      - name: Pack and publish @flagshark/core
        run: bun pm pack && npm publish *.tgz --access public
        working-directory: packages/core
      - name: Pack and publish flagshark
        run: bun pm pack && npm publish *.tgz --access public
        working-directory: packages/cli

  promote-major-action-tag:
    name: Promote stable v2 Action tag
    needs: publish
    if: ${{ !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v2.') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Move the floating v2 tag to this release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/release-guards.mjs promote-v2
