name: Release to npm
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # NOTE: do NOT use --frozen-lockfile here. We need bun install to sync the
      # lockfile to whatever versions the bumped package.json files declare, so
      # that `bun pm pack` rewrites workspace:* to the current release version
      # (not the previous release version, which is what `bun.lock` records on
      # the commit that did the bump). See issue #5 (v1.3.0 shipped flagshark
      # depending on @flagshark/core@1.2.0 because the lockfile lagged).
      - run: bun install
      - run: bun run build
      - run: bun run test
      # bun pm pack rewrites workspace:* in the tarball; npm publishes the tarball
      # with OIDC-based provenance (trusted publisher must be configured on npm.com).
      # bun publish doesn't read NODE_AUTH_TOKEN; npm does.
      - name: Pack and publish @flagshark/core
        run: bun pm pack && npm publish *.tgz --access public --provenance
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Pack and publish flagshark
        run: bun pm pack && npm publish *.tgz --access public --provenance
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
