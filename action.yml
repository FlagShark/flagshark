name: 'FlagShark'
description: 'Find stale feature flags in your PRs'
author: 'FlagShark'

inputs:
  scan:
    description: 'Scan mode: "changed" (PR files only) or "full" (entire repo)'
    required: false
    default: 'changed'
  threshold:
    description: 'Staleness threshold in days'
    required: false
    default: '30'
  fail-threshold:
    description: 'Health score below which the check fails (0 = never fail)'
    required: false
    default: '0'
  output-format:
    description: 'PR comment format: `markdown` (default) or `none` to disable. To emit SARIF, use the `sarif:` input instead.'
    required: false
    default: 'markdown'
  sarif:
    description: 'Write SARIF v2.1.0 output to this path (default: do not write)'
    required: false
  no-cache:
    description: 'Skip platform-flag cache, force re-fetch'
    required: false
    default: 'false'
  fail-on-error:
    description: 'Fail the build when any missing-in-platform flag is detected (default: true)'
    required: false
    default: 'true'

outputs:
  health-score:
    description: 'Flag health score (0-100)'
  stale-count:
    description: 'Number of unique stale flag names found'
  total-count:
    description: 'Total number of flags detected'
  sarif-path:
    description: 'Absolute path to the SARIF file written (only set when sarif: input is provided)'
  error-count:
    description: 'Number of unique flag names with error-severity signals (e.g., missing-in-platform)'

runs:
  using: 'node20'
  main: 'packages/action/dist/action.cjs'

branding:
  icon: 'flag'
  color: 'blue'
